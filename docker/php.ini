; Mounted after Sail's own 99-sail.ini (conf.d loads alphabetically, so the file
; name has to sort last) to lift its 100M ceiling: the app offers documents up to
; 1 GB, and PHP rejects a larger body before validation gets a say.
;
; Keep in step with App\Support\UploadedDocument::MAX_KILOBYTES.
[PHP]
post_max_size = 1025M
upload_max_filesize = 1024M

; An upload is streamed to a temp file, not held in memory — but the checksum and
; the mimetype sniff still walk it, so leave some headroom over the default.
memory_limit = 512M

; A gigabyte over a mobile connection outlasts the default 60s.
max_execution_time = 600
max_input_time = 600
