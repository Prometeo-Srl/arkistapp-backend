version: 2
updates:
  - package-ecosystem: composer
    directory: /
    # Repo default is main, but develop is the active branch — PRs must land there.
    target-branch: develop
    # Freshness is not the goal, so version updates run monthly to keep the
    # merge noise down. Security updates ignore this schedule entirely: they are
    # advisory-triggered, and also bypass the PR limit and the `ignore` rules
    # below, which only ever applied to version updates.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Patch/minor land as one PR; a major needs a human reading the upgrade guide.
    # The framework is excluded from the group so it arrives as its own PR — the
    # auto-merge workflow leaves that one open for a human.
    groups:
      patches:
        patterns: ['*']
        exclude-patterns: ['laravel/framework']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Action versions get their own CVEs; keep the workflow itself patched.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
