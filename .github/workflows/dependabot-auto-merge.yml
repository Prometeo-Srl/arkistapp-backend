name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  # alert-lookup below reads the advisory behind the PR.
  security-events: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          # Populates ghsa-id/cvss, which is how a security fix is told apart
          # from a routine bump below.
          alert-lookup: true
          compat-lookup: false

      # A CVE fix is the one thing that must land unattended, so it merges at any
      # semver level and for any package — the minimum patched version is often a
      # major, and gating on that is how an abandoned repo stays vulnerable.
      # Everything else is housekeeping and keeps the cautious rules: no majors,
      # and the framework waits for a human.
      #
      # `gh pr merge --auto` is not used: auto-merge only waits when branch
      # protection requires a check, which the org plan does not allow on
      # develop. Without that it merges ahead of CI. So wait here, then merge.
      - name: Merge once CI passes
        if: >-
          steps.meta.outputs.ghsa-id != '' ||
          (steps.meta.outputs.update-type != 'version-update:semver-major' &&
           !contains(steps.meta.outputs.dependency-names, 'laravel/framework'))
        run: |
          # Give CI a moment to register its checks; `gh pr checks` fails when
          # none exist yet, which would read as a green light.
          sleep 30
          gh pr checks "$PR_URL" --watch --fail-fast --interval 20
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An advisory whose fix cannot merge is the failure mode this whole file
      # exists to prevent. Make it loud instead of letting it sit in the PR list:
      # a failed run emails the repo admins, which is the only channel left once
      # nobody is reading pull requests.
      - name: Fail when a security fix needs a human
        if: >-
          steps.meta.outputs.ghsa-id != '' &&
          failure()
        run: |
          echo "::error::Security fix for ${{ steps.meta.outputs.dependency-names }}" \
               "(${{ steps.meta.outputs.ghsa-id }}, CVSS ${{ steps.meta.outputs.cvss }})" \
               "could not be merged automatically. $PR_URL"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
